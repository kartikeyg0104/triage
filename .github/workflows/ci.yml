name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Allow unprivileged network namespaces (needed by the sandbox tests)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q -rs unit_tests

  kubernetes:
    # Real Jobs on a real kind cluster with Calico (which enforces NetworkPolicy).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: helm/kind-action@v1.12.0
        with:
          install_only: true
      - name: Create kind cluster with Calico
        run: deploy/kind/setup.sh claimcheck
      - name: Apply least-privilege RBAC and restricted Pod Security (deploy/k8s)
        # setup.sh created namespace claimcheck; this labels it and adds the executor's ServiceAccount and Role.
        run: |
          kubectl --context kind-claimcheck apply -k deploy/k8s
          kubectl --context kind-claimcheck get namespace claimcheck --show-labels
          kubectl --context kind-claimcheck auth can-i create jobs.batch -n claimcheck \
            --as system:serviceaccount:claimcheck:claimcheck-executor
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Integration tests on the cluster
        env:
          CLAIMCHECK_K8S_CONTEXT: kind-claimcheck
        run: python -m pytest -v -rs unit_tests/integration
      - name: Example through the Kubernetes executor
        run: examples/run_kubernetes.sh || test $? -eq 1

  image:
    # Builds the Dockerfile and smoke-tests the CLI and the service with a read-only root filesystem.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGE: claimcheck:ci
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t "$IMAGE" .
      - name: Image facts
        run: |
          docker image ls "$IMAGE"
          test "$(docker run --rm --read-only --entrypoint id "$IMAGE" -u)" = 10001
          docker run --rm --read-only --entrypoint python "$IMAGE" -c \
            'import shutil, sys; found = [t for t in ("gcc", "cc", "c++", "make") if shutil.which(t)]; print("compilers:", found); sys.exit(bool(found))'
      - name: CLI --help
        run: docker run --rm --read-only "$IMAGE" --help
      - name: CLI check on the example (expects exit 1, refuted)
        run: |
          set +e
          docker run --rm --read-only -v "$PWD/examples:/examples:ro" "$IMAGE" \
            check --no-model --repo /examples/sample_repo --report /examples/report.txt \
            --diff /examples/pr.diff > "$RUNNER_TEMP/report.md"
          code=$?
          set -e
          cat "$RUNNER_TEMP/report.md"
          test "$code" -eq 1
          grep -q "Verdict: refuted" "$RUNNER_TEMP/report.md"
          grep -q "parse_url_v2" "$RUNNER_TEMP/report.md"
      - name: Service answers 404 for an unknown investigation
        run: |
          docker run -d --name claimcheck-server --read-only --tmpfs /tmp -p 127.0.0.1:8080:8080 \
            -v "$PWD/examples:/examples:ro" -e CLAIMCHECK_API_TOKEN=smoke-test-token --entrypoint python "$IMAGE" \
            -m claimcheck.server --db /tmp/claimcheck.db --repo-root /examples --host 0.0.0.0 --port 8080
          for _ in $(seq 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer smoke-test-token' localhost:8080/v1/investigations/does-not-exist || true)
            [ "$code" != "000" ] && break
            sleep 1
          done
          docker logs claimcheck-server
          docker rm -f claimcheck-server
          test "$code" = 404
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Image integration tests
        env:
          CLAIMCHECK_TEST_IMAGE: ${{ env.IMAGE }}
        run: python -m pytest -v -rs unit_tests/integration/test_image.py

  evaluation:
    # The real evaluation on eval/cases; fails on any wrong definite answer or a drop below eval/baseline.json.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Allow unprivileged network namespaces (the repro cases need the sandbox)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Evaluate
        run: python -m claimcheck.evaluate --runs 2 --json eval-results.json --out eval-summary.md
      - name: Job summary
        if: ${{ !cancelled() && hashFiles('eval-summary.md') != '' }}
        run: cat eval-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: ${{ !cancelled() && hashFiles('eval-results.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval-results.json
          if-no-files-found: error
      - name: Compare with the baseline
        if: ${{ !cancelled() }}
        run: python tools/check_eval_baseline.py eval-results.json eval/baseline.json

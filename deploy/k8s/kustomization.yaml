# Least-privilege setup for the claimcheck Kubernetes executor.
#   kubectl apply -k deploy/k8s
# Then run the executor as the ServiceAccount, e.g. with a kubeconfig holding a token from
#   kubectl -n claimcheck create token claimcheck-executor
# or, from an admin context, KubernetesExecutor(impersonate="system:serviceaccount:claimcheck:claimcheck-executor").
# See docs/KUBERNETES_SECURITY.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - role.yaml
  - rolebinding.yaml
  - quota.yaml
  - limitrange.yaml
labels:
  - pairs:
      app.kubernetes.io/name: claimcheck
      app.kubernetes.io/component: executor

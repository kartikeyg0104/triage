# Every pod in this namespace must meet the "restricted" Pod Security Standard: non-root,
# no privilege escalation, all capabilities dropped, seccomp RuntimeDefault, no host access.
# enforce rejects pods that do not; audit and warn also flag Jobs whose pod template would not.
apiVersion: v1
kind: Namespace
metadata:
  name: claimcheck
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest

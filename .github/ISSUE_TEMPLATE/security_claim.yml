name: Security claim (public)
description: A security claim that is safe to discuss in public, e.g. already disclosed or not exploitable. Report anything else privately.
title: "[Security]: "
labels: ["security"]
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. If the problem is not yet disclosed or could be exploited, do not file it here: use [private vulnerability reporting](https://github.com/kartikeyg0104/triage/security/advisories/new) instead.
  - type: input
    id: symbol
    attributes:
      label: Affected function or class
      description: The name as written in the code, e.g. `verify_signature`.
      placeholder: verify_signature
    validations:
      required: true
  - type: textarea
    id: repro_command
    attributes:
      label: Repro command
      description: One shell command that shows the problem from a clean checkout. It is never run as-is.
      placeholder: python -c "from pkg import verify_signature; print(verify_signature(b'', b''))"
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected_error
    attributes:
      label: Expected error text
      description: The error or output the command produces.
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The release or git commit you tested.
      placeholder: v1.2.3 or abc1234
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: The impact and how the problem can be triggered.
    validations:
      required: true

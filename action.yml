name: claimcheck
description: Test the claims in a pull request or issue and post the evidence as a comment.
inputs:
  path:
    description: Path of the checked-out repository to search.
    default: "."
  repro:
    description: Command that reproduces the reported failure. Run in a no-network sandbox. Never taken from the PR text.
    default: ""
  expect:
    description: Text the failing repro command should print.
    default: ""
  verify-fix:
    description: Run the workflow repro on the PR base and head SHAs from the event to verify a fix. Both commits must be fetched; use actions/checkout with fetch-depth 0. Missing commits leave the fix unverified.
    default: "false"
  comment:
    description: Post the report as a PR/issue comment.
    default: "true"
  fail-on-refuted:
    description: Fail the check when a claim is refuted.
    default: "false"
  check-run:
    description: Create a "claimcheck" Check Run on the PR head commit, with annotations. Needs the "checks write" permission; without it a warning is logged and the job continues.
    default: "true"
  github-token:
    description: Token used to read the diff and post the comment.
    default: ${{ github.token }}
outputs:
  verdict:
    description: Overall verdict, one of supported, refuted or unverified.
    value: ${{ steps.check.outputs.verdict }}
  confirmed:
    description: Number of claims confirmed.
    value: ${{ steps.check.outputs.confirmed }}
  refuted:
    description: Number of claims refuted.
    value: ${{ steps.check.outputs.refuted }}
  unverified:
    description: Number of claims left unverified.
    value: ${{ steps.check.outputs.unverified }}
  report-json:
    description: Path of the JSON report written under $RUNNER_TEMP.
    value: ${{ steps.check.outputs.report-json }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install claimcheck
      shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}"
    - name: Check the claims
      id: check
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_REPRO: ${{ inputs.repro }}
        INPUT_EXPECT: ${{ inputs.expect }}
        INPUT_VERIFY_FIX: ${{ inputs.verify-fix }}
        INPUT_COMMENT: ${{ inputs.comment }}
        INPUT_FAIL_ON_REFUTED: ${{ inputs.fail-on-refuted }}
        INPUT_CHECK_RUN: ${{ inputs.check-run }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: python -m claimcheck.action

# Exactly what claimcheck/k8s.py's kubectl calls need, in namespace claimcheck only:
#   kubectl apply -f -  (ConfigMap, NetworkPolicy, Job)   get (does it exist?), create
#   kubectl get pods -l <run> -o json                     pods: list
#   kubectl logs job/<name>                               jobs: get, pods: list, pods/log: get
#   kubectl delete jobs,configmaps,networkpolicies -l <run> --wait=true
#                                                         list, delete, watch (while an object is
#                                                         still terminating)
# No patch: every run uses fresh object names, so apply always creates; re-applying an existing
# object would be refused. Not granted either: secrets, creating pods directly, pods/exec, attach,
# port-forward, tokens, RBAC objects, update, deletecollection, any other namespace, anything
# cluster-wide. Each permission here was removed in turn on a real cluster to check it is needed
# (docs/KUBERNETES_SECURITY.md).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: claimcheck-executor
  namespace: claimcheck
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "list", "delete", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "create", "list", "delete", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "create", "list", "delete", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
